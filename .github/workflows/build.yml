# ビルドとリリース。説明は docs/ビルド手順.md の「GitHub Actions」にある。
#
# - main への push と pull request: ビルドとテストを行い、zip を作る。
#   zip は、実行結果のページの Artifacts からダウンロードできる。
# - タグ v*（v0.1.0 など）の push: 上に加えて、Releases に下書きを作り、zip を置く。
#   下書きは、作成者が確かめてから公開する。

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # GitHub の Windows マシンの git は、取り出すときに改行を CRLF に変える設定になっている。
      # 手元（変換しない）と同じ中身の zip を作るため、変換しないようにする。
      - name: 改行コードを変換しない設定にする
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      # RubyInstaller の Ruby と、付属の MSYS2（gcc など）を入れる。手元の開発環境と同じ構成である。
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: gcc の版を記録する
        run: ridk exec gcc --version

      - name: タグとバージョンが一致することを確かめる
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(rake -s version)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "タグ（$GITHUB_REF_NAME）と src/version.h のバージョン（$version）が一致しません" >&2
            exit 1
          fi

      - name: ビルドとテスト
        run: rake test

      - name: zip を作る
        run: rake package

      - uses: actions/upload-artifact@v7
        with:
          name: pikulix
          path: build/pikulix-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Releases に下書きを作るため
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pikulix

      - name: Releases に下書きを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$(ls pikulix-*.zip)"
          sha256="$(sha256sum "$zip" | cut -d ' ' -f 1)"
          cat > notes.md <<EOF
          ## 変更点

          （公開する前に書く）

          ## ダウンロード

          \`$zip\` をダウンロードし、展開して使う。使い方は README にある。

          SHA-256: \`$sha256\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Pikulix ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
